  const loc=(t,d)=>(H[t]||[]).forEach(f=>f({data:d}));
  const listFor=ex=>{const l=[];if(ex!=='host')l.push({id:'host',p:hp});C.forEach((c,k)=>{if(k!==ex)l.push({id:k,p:c.p})});return l};
  const push=l=>PL.forEach(f=>f({peers:l.map(q=>({peer:q.id,isMe:false,kind:'viewer',presence:q.p}))}));
  const R={onPeers:f=>{PL.push(f);return()=>{}},on:(t,f)=>{(H[t]=H[t]||[]).push(f);return()=>{}},
    emit:(t,d)=>{if(hostConn)hostConn.send({t:'ev',topic:t,data:d});else C.forEach(c=>c.conn.send({t:'ev',topic:t,data:d}));return Promise.resolve()},
    presence:p=>{if(hostConn){if(hostConn.open)hostConn.send({t:'pres',p})}else{Object.assign(hp,p);dirty=1}return Promise.resolve()},
    leave:()=>{clearInterval(tm);try{me.destroy()}catch(e){}return Promise.resolve()}};
  const host=new Peer(id);me=host;host.on('disconnected',()=>{try{host.reconnect()}catch(x){}});
  host.on('open',()=>{ok=1;
    host.on('connection',conn=>{
      conn.on('open',()=>{C.set(conn.peer,{conn,p:{}});dirty=1});
      conn.on('data',m=>{const c=C.get(conn.peer);if(!c)return;
        if(m.t==='pres'){Object.assign(c.p,m.p);dirty=1}
        else if(m.t==='ev'){C.forEach((o,k)=>{if(k!==conn.peer)o.conn.send(m)});loc(m.topic,m.data)}});
      conn.on('close',()=>{C.delete(conn.peer);dirty=1});
    });
    tm=setInterval(()=>{if(!dirty)return;dirty=0;C.forEach((c,k)=>{if(c.conn.open)c.conn.send({t:'peers',list:listFor(k)})});push(listFor('host'))},50);
    res(R)});
  host.on('error',e=>{
    if(e.type==='unavailable-id'){
      host.destroy();me=new Peer();me.on('disconnected',()=>{try{me.reconnect()}catch(x){}});
      me.on('open',()=>{hostConn=me.connect(id,{reliable:false});
        hostConn.on('open',()=>{ok=1;res(R)});
        hostConn.on('data',m=>{if(m.t==='peers')push(m.list);else if(m.t==='ev')loc(m.topic,m.data)});
        hostConn.on('close',()=>push([]));
        setTimeout(()=>{if(!ok)rej(new Error('lobby not responding'))},8000)});
      me.on('error',x=>{if(!ok)rej(x)});
    }else if(!ok)rej(e)});
})}
function wsJoin(addr,name){return new Promise((res,rej)=>{
  let ws;const H={},PL=[];let ok=0;
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+addr.replace(/^(https?|wss?):\/\//,'').replace(/\/$/,''))}catch(e){return rej(e)}
  const R={onPeers:f=>{PL.push(f);return()=>{}},on:(t,f)=>{(H[t]=H[t]||[]).push(f);return()=>{}},
    emit:(t,d)=>{ws.send(JSON.stringify({t:'ev',topic:t,data:d}));return Promise.resolve()},
    presence:p=>{if(ws.readyState===1)ws.send(JSON.stringify({t:'pres',p}));return Promise.resolve()},
    leave:()=>{ws.close();return Promise.resolve()}};
  ws.onopen=()=>{ok=1;ws.send(JSON.stringify({t:'join',room:name}));res(R)};
  ws.onerror=()=>{if(!ok)rej(new Error('cannot reach '+addr))};
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.t==='peers')PL.forEach(f=>f({peers:m.list.map(q=>({peer:q.id,isMe:false,kind:'viewer',presence:q.p}))}));
    else if(m.t==='ev'&&H[m.topic])H[m.topic].forEach(f=>f({data:m.data}));
    else if(m.t==='full')msg('Lobby is full.')};
})}
let mode='menu',lobbyCode='',roomBase,allPeers=[];
const msg=t=>$('mmsg').textContent=t;
function startGame(){document.body.classList.add('playing');mode='game';$('menu').hidden=true;lv=0;L=make();deaths=0;dead=0;won=false}
async function enter(code){
  msg('');
  try{if(roomBase===undefined)roomBase=typeof claude!=='undefined'?await claude.use('room'):null}catch(e){roomBase=null}
  const addr=$('srv').value.trim(),rb=roomBase||{join:addr?n=>wsJoin(addr,n):p2pJoin};
  try{
    room=await rb.join('lobby-'+code.toLowerCase());lobbyCode=code;
    room.onPeers(ch=>{allPeers=ch.peers.filter(q=>!q.isMe&&q.kind==='viewer');peers=allPeers.filter(q=>q.presence&&q.presence.x!=null);$('lcount').textContent='Players in lobby: '+(allPeers.length+1)});
    room.on('go',()=>{if(mode!=='game')startGame()});
    $('lcode').textContent='Lobby code: '+code;
    if(/^https?:$/.test(location.protocol))fetch('/ip').then(r=>r.json()).then(a=>{$('lip').textContent=/^(localhost|127\.|192\.168\.|10\.|172\.)/.test(location.hostname)?'Friends on your Wi-Fi open: '+a.join('  or  '):'Friends open: '+location.origin}).catch(()=>{});$('m-main').hidden=true;$('m-lobby').hidden=false;mode='lobby';
    room.presence({lobby:1}).catch(()=>{});
  }catch(e){room=null;msg('Could not join: '+errT(e))}
}
function lbl(c){return c.replace('Arrow','').replace('Key','').replace('Up','↑').replace('Down','↓').replace('Left','←').replace('Right','→')}
function save(){try{localStorage.setItem('ep-set',JSON.stringify({b:binds,c:me}))}catch(e){}}
try{const v=JSON.parse(localStorage.getItem('ep-set'));if(v){Object.assign(binds,v.b);if(v.c>=0&&v.c<6)me=v.c}}catch(e){}
const SETB=document.querySelectorAll('#m-set [data-b]'),NM={l:'Left',r:'Right',j:'Jump'};
COL.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.onclick=()=>{me=i;save();refresh()};$('sw').appendChild(b)});
function refresh(){SETB.forEach(b=>b.textContent=NM[b.dataset.b]+': '+(rebind===b.dataset.b?'press a key…':lbl(binds[b.dataset.b])));[...$('sw').children].forEach((c,i)=>c.style.outline=i===me?'3px solid #fff':'none')}
SETB.forEach(b=>b.onclick=()=>{rebind=b.dataset.b;refresh()});
$('settings').onclick=()=>{$('m-main').hidden=true;$('m-set').hidden=false;refresh()};
$('back').onclick=()=>{rebind=null;$('m-set').hidden=true;$('m-main').hidden=false};
function goMenu(){
  if(room){room.leave().catch(()=>{});room=null}
  lobbyCode='';peers=[];allPeers=[];mode='menu';document.body.classList.remove('playing');K.l=K.r=K.j=0;
  $('menu').hidden=false;$('m-lobby').hidden=true;$('m-set').hidden=true;$('m-main').hidden=false;msg('');
}
if(typeof claude!=='undefined')$('srv').hidden=true;else if(/^https?:$/.test(location.protocol))fetch('/ip').then(r=>{if(r.ok)$('srv').value=location.host}).catch(()=>{});
$('solo').onclick=startGame;
$('create').onclick=()=>enter(Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join(''));
$('join').onclick=()=>{const c=$('code').value.toUpperCase().trim();c.length===4?enter(c):msg('Enter a 4-letter code.')};
$('go').onclick=()=>{try{room.emit('go',{})}catch(e){}startGame()};
setInterval(()=>{if(room&&mode==='game'){const p=L.p;room.presence({l:lv,x:p.x|0,y:p.y|0,f:p.f,ph:+ph.toFixed(2),c:me,d:dead?1:0,dt:dead?55-dead:0,a:dead?'dead':won?'win':!p.on?(p.vy<0?'jump':'fall'):p.vx?'run':'idle'}).catch(()=>{})}},80);
let last=0,acc=0;
function loop(ts){
  acc+=Math.min(50,ts-last);last=ts;
  while(acc>=16.67){update();acc-=16.67}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
