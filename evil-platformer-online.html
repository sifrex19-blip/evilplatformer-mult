const $=id=>document.getElementById(id);
function errT(e){const t=e&&e.type;return ['network','server-error','socket-error','socket-closed'].includes(t)?'cannot reach the PeerJS service (blocked by your network, or it is busy). Refresh and try again, or try another network.':t==='peer-unavailable'?'lobby host not found':((e&&e.message)||String(e))}
function p2pJoin(name){return new Promise((res,rej)=>{
  if(typeof Peer==='undefined')return rej(new Error('multiplayer library could not load (check your internet)'));
  const id='evilplat-'+name.replace(/[^a-z0-9]/g,''),H={},PL=[],C=new Map();let me,hostConn,dirty=0,hp={},ok=0,tm;
  const loc=(t,d)=>(H[t]||[]).forEach(f=>f({data:d}));
  const listFor=ex=>{const l=[];if(ex!=='host')l.push({id:'host',p:hp});C.forEach((c,k)=>{if(k!==ex)l.push({id:k,p:c.p})});return l};
  const push=l=>PL.forEach(f=>f({peers:l.map(q=>({peer:q.id,isMe:false,kind:'viewer',presence:q.p}))}));
  const R={onPeers:f=>{PL.push(f);return()=>{}},on:(t,f)=>{(H[t]=H[t]||[]).push(f);return()=>{}},
    emit:(t,d)=>{if(hostConn)hostConn.send({t:'ev',topic:t,data:d});else C.forEach(c=>c.conn.send({t:'ev',topic:t,data:d}));return Promise.resolve()},
    presence:p=>{if(hostConn){if(hostConn.open)hostConn.send({t:'pres',p})}else{Object.assign(hp,p);dirty=1}return Promise.resolve()},
    leave:()=>{clearInterval(tm);try{me.destroy()}catch(e){}return Promise.resolve()}};

      conn.on('data',m=>{const c=C.get(conn.peer);if(!c)return;
        if(m.t==='pres'){Object.assign(c.p,m.p);dirty=1}
        else if(m.t==='ev'){C.forEach((o,k)=>{if(k!==conn.peer)o.conn.send(m)});loc(m.topic,m.data)}});

function wsJoin(addr,name){return new Promise((res,rej)=>{
  let ws;const H={},PL=[];let ok=0;
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+addr.replace(/^(https?|wss?):\/\//,'').replace(/\/$/,''))}catch(e){return rej(e)}
  const R={onPeers:f=>{PL.push(f);return()=>{}},on:(t,f)=>{(H[t]=H[t]||[]).push(f);return()=>{}},
    emit:(t,d)=>{ws.send(JSON.stringify({t:'ev',topic:t,data:d}));return Promise.resolve()},
    presence:p=>{if(ws.readyState===1)ws.send(JSON.stringify({t:'pres',p}));return Promise.resolve()},
    leave:()=>{ws.close();return Promise.resolve()}};
  ws.onopen=()=>{ok=1;ws.send(JSON.stringify({t:'join',room:name}));res(R)};
  ws.onerror=()=>{if(!ok)rej(new Error('cannot reach '+addr))};
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.t==='peers')PL.forEach(f=>f({peers:m.list.map(q=>({peer:q.id,isMe:false,kind:'viewer',presence:q.p}))}));
    else if(m.t==='ev'&&H[m.topic])H[m.topic].forEach(f=>f({data:m.data}));
    else if(m.t==='full')msg('Lobby is full.')};
})}
